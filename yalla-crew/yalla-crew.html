<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Hind:wght@400;500;600;700&display=swap">
<style>
/* Layout: a phone-app shell (max 520px): app bar, landmark silhouette strip, one scrolling screen, bottom tab bar and a + button; forms open as bottom sheets. */
:root {
  --bg: #f5f6f8;
  --card: #ffffff;
  --ink: #111418;
  --muted: #6b7280;
  --line: #e6e8ec;
  --accent: #ff5a1f;      /* one sporty orange for actions */
  --accent-ink: #ffffff;
  --accent-soft: #fff0ea;
  --bike: #2563eb;
  --run: #ff5a1f;
  --ok: #16a34a;
  --danger: #dc2626;
  --sky: #ffe8da;
  --shade: #1f2430;       /* landmark silhouettes */
  --scrim: rgba(17, 20, 24, .45);
  --font: "Barlow", system-ui, "Segoe UI", Roboto, sans-serif;
  --logo: "Barlow Condensed", "Arial Narrow", sans-serif;
  --r: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1115; --card: #181b22; --ink: #f2f4f7; --muted: #9aa1ad; --line: #262a33;
    --accent: #ff6b35; --accent-ink: #ffffff; --accent-soft: #2a1a12; --bike: #5b8cff; --run: #ff6b35;
    --ok: #4ade80; --danger: #f87171; --sky: #1d1a1c; --shade: #000000; --scrim: rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1115; --card: #181b22; --ink: #f2f4f7; --muted: #9aa1ad; --line: #262a33;
  --accent: #ff6b35; --accent-ink: #ffffff; --accent-soft: #2a1a12; --bike: #5b8cff; --run: #ff6b35;
  --ok: #4ade80; --danger: #f87171; --sky: #1d1a1c; --shade: #000000; --scrim: rgba(0, 0, 0, .6);
  color-scheme: dark;
}
[lang="ar"] { --font: "IBM Plex Sans Arabic", system-ui, Tahoma, sans-serif; }
[lang="hi"] { --font: "Hind", "Nirmala UI", system-ui, sans-serif; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); }
body { color: var(--ink); font: 15px/1.5 var(--font); -webkit-tap-highlight-color: transparent; }
#app { font-family: var(--font); max-width: 520px; margin: 0 auto; min-height: 100vh; background: var(--bg); position: relative; }
.pad { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font-family: inherit; }
button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* App bar */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sky); }
.appbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--sky); display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px 6px; }
.logo { margin: 0; white-space: nowrap; font: italic 700 24px/1 var(--logo); letter-spacing: .02em; text-transform: uppercase; display: flex; align-items: baseline; gap: 8px; }
.logo span { font: 700 18px/1 "IBM Plex Sans Arabic", sans-serif; font-style: normal; text-transform: none; color: var(--accent); }
.langsel { width: auto; flex: none; appearance: none; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 6px 14px; font: 600 13px var(--font); }
.hero { background: var(--sky); }
.skyline { display: block; width: 100%; height: auto; }
.skyline .s { fill: var(--shade); }
.skyline .o { fill: none; stroke: var(--shade); }
.skyline .sun { fill: var(--accent); opacity: .9; }

/* Screen */
main { padding-block: 14px calc(96px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }
.screen { display: grid; gap: 14px; }
.h2 { margin: 0; font: 700 20px/1.2 var(--font); }
.sub { margin: 0; color: var(--muted); font-size: 13px; }
.notice { background: var(--card); border-radius: var(--r); padding: 14px 16px; color: var(--muted); font-size: 14px; }
.notice strong { color: var(--ink); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: var(--card); border-radius: var(--r); padding: 12px 4px; }
.stat { text-align: center; display: grid; gap: 2px; }
.stat + .stat { border-inline-start: 1px solid var(--line); }
.stat b { font: 700 22px/1.1 var(--font); font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 12px; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-block: 2px; margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding-inline: max(16px, env(safe-area-inset-left, 0px)); }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 7px 14px; font: 600 13px var(--font); cursor: pointer; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
select.chip { width: auto; appearance: none; padding: 7px 14px; border-radius: 999px; }
.search { width: 100%; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 12px; padding: 11px 14px; font: 15px var(--font); }

/* Ride cards */
.list { display: grid; gap: 12px; }
.card { background: var(--card); border-radius: var(--r); overflow: hidden; }
.ride { padding: 14px 16px; display: grid; gap: 10px; --sport: var(--bike); }
.ride.run { --sport: var(--run); }
.ride.past { opacity: .6; }
.ride.target { box-shadow: 0 0 0 2px var(--accent); }
.ride .top { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.tag { display: inline-flex; align-items: center; gap: 5px; font-weight: 700; color: var(--sport); }
.tag::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--sport); }
.badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.badge.muted { background: var(--bg); color: var(--muted); }
.ride h3 { margin: 0; font: 700 18px/1.3 var(--font); }
.ride .when { margin: 0; color: var(--muted); font-size: 13px; }
.nums { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.nums div { background: var(--bg); border-radius: 10px; padding: 8px 10px; display: grid; }
.nums b { font: 700 18px/1.2 var(--font); font-variant-numeric: tabular-nums; }
.nums span { font-size: 11px; color: var(--muted); }
.row { display: flex; align-items: center; gap: 10px; }
.faces { display: flex; }
.faces img { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--card); margin-inline-start: -8px; background: var(--line); }
.faces img:first-child { margin-inline-start: 0; }
.count { font-size: 13px; color: var(--muted); flex: 1; min-width: 0; }
.full-tag { color: var(--danger); font-weight: 600; }
.btn { border: 0; border-radius: 12px; padding: 10px 16px; font: 700 14px var(--font); cursor: pointer; background: var(--accent); color: var(--accent-ink); }
.btn.soft { background: var(--bg); color: var(--ink); }
.btn.block { width: 100%; padding-block: 14px; font-size: 16px; }
.btn:disabled { opacity: .5; }
.links { display: flex; gap: 16px; flex-wrap: wrap; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); font: 600 13px var(--font); cursor: pointer; }
.linkbtn.danger { color: var(--danger); }
.details { display: grid; gap: 10px; border-top: 1px solid var(--line); padding-top: 10px; }
.notes { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; }
.ai { background: var(--bg); border-radius: 10px; padding: 10px 12px; white-space: pre-wrap; font-size: 14px; overflow-wrap: anywhere; }
.map { background: var(--bg); border-radius: 12px; padding: 6px; }
.map svg { width: 100%; height: auto; display: block; }
.map .grid { stroke: var(--line); stroke-width: 1; }
.map .route { fill: none; stroke: var(--sport); stroke-width: 3.5; stroke-linejoin: round; stroke-linecap: round; }
.map .start { fill: var(--ok); }
.map .end { fill: var(--ink); }
.map .lbl { fill: var(--muted); font: 600 11px var(--font); }
.map .scale { stroke: var(--ink); stroke-width: 2; }
.map .empty { fill: var(--muted); font: 13px var(--font); }
.map .elev { fill: var(--sport); opacity: .18; }
.map .elev-line { fill: none; stroke: var(--sport); stroke-width: 1.5; }
.ai-btn { justify-self: start; }

/* Market */
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.item { display: grid; grid-template-rows: auto 1fr; }
.item.sold { opacity: .55; }
.item .ph { aspect-ratio: 1; max-width: 100%; background: var(--line); display: grid; place-items: center; color: var(--muted); font-size: 12px; position: relative; }
.item .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.item .ph .badge { position: absolute; top: 8px; inset-inline-start: 8px; }
.item .ph .badge.sold { background: var(--danger); color: #fff; }
.item .body { padding: 10px 12px 12px; display: grid; gap: 4px; align-content: start; min-width: 0; }
.item .price { font: 700 17px/1.2 var(--font); font-variant-numeric: tabular-nums; }
.item .price small { font-size: 12px; color: var(--muted); font-weight: 600; }
.item h3 { margin: 0; font: 500 14px/1.35 var(--font); overflow-wrap: anywhere; }
.item .meta { font-size: 11px; color: var(--muted); }
.item .desc { margin: 0; font-size: 12px; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
.item .tag { font-size: 11px; }
.item.both { --sport: var(--accent); }
.item.bike { --sport: var(--bike); }
.item.run { --sport: var(--run); }
.contact { display: grid; gap: 6px; margin-top: 6px; }
.contact .num { font: 600 13px var(--font); direction: ltr; unicode-bidi: isolate; user-select: all; overflow-wrap: anywhere; }
.contact .acts { display: flex; gap: 6px; }
.contact .acts > * { flex: 1; text-align: center; border-radius: 10px; padding: 7px 6px; font: 700 12px var(--font); text-decoration: none; cursor: pointer; border: 0; }
.contact .wa { background: var(--ok); color: #fff; }
.contact .cp { background: var(--bg); color: var(--ink); }

/* Ranking */
.rank { padding: 6px 0; }
.rank ol { margin: 0; padding: 0; list-style: none; }
.rank li { display: grid; grid-template-columns: 28px 36px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 16px; }
.rank li + li { border-top: 1px solid var(--line); }
.rank .rk { font: 700 16px var(--font); color: var(--muted); text-align: center; }
.rank li:nth-child(1) .rk { color: var(--accent); }
.rank img { width: 36px; height: 36px; border-radius: 50%; background: var(--line); }
.rank .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.rank .km { font: 700 14px var(--font); font-variant-numeric: tabular-nums; color: var(--muted); }

/* Bottom bar + FAB */
.tabbar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 6; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar .in { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.tabbar button { border: 0; background: none; color: var(--muted); display: grid; justify-items: center; gap: 3px; padding: 9px 4px 8px; font: 600 12px var(--font); cursor: pointer; }
.tabbar svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tabbar button[aria-current="page"] { color: var(--accent); }
.fab-wrap { position: fixed; bottom: calc(72px + env(safe-area-inset-bottom, 0px)); left: 0; right: 0; z-index: 6; pointer-events: none; }
.fab-wrap .in { max-width: 520px; margin: 0 auto; display: flex; justify-content: flex-end; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.fab { pointer-events: auto; width: 56px; height: 56px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); font: 400 32px/1 var(--font); cursor: pointer; box-shadow: 0 6px 18px rgba(255, 90, 31, .35); }

/* Bottom sheet */
.sheet-bg { position: fixed; inset: 0; z-index: 20; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 520px; max-height: 92vh; overflow-y: auto; background: var(--card); border-radius: 22px 22px 0 0; padding-top: 8px; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); justify-self: center; }
.sheet header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.close { border: 0; background: var(--bg); color: var(--ink); width: 34px; height: 34px; border-radius: 50%; font-size: 18px; cursor: pointer; }
.fields { display: grid; gap: 12px; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
label { display: grid; gap: 5px; font-size: 13px; font-weight: 600; color: var(--muted); }
input, select, textarea { font: 16px var(--font); color: var(--ink); background: var(--bg); border: 1px solid transparent; border-radius: 12px; padding: 11px 12px; width: 100%; }
textarea { min-height: 80px; resize: vertical; }
.garmin { background: var(--bg); border-radius: 12px; padding: 12px; display: grid; gap: 6px; border: 1px dashed var(--line); }
.garmin.drag { border-color: var(--accent); }
.garmin p { margin: 0; font-size: 12px; color: var(--muted); }
.garmin input { background: var(--card); }
.garmin .ok { color: var(--ok); font-weight: 600; }
.err { color: var(--danger); font-size: 13px; margin: 0; min-height: 1em; }
.foot { color: var(--muted); font-size: 12px; text-align: center; margin: 4px 0 0; }
@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: up .22s ease-out; }
  @keyframes up { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
}
</style>

<div id="app" dir="rtl" lang="ar">
  <div class="appbar pad">

    <select id="langSel" class="langsel" data-i18n-aria="langLabel">

      <option value="fil" lang="fil">Filipino</option>

  <div class="hero">

  <main class="pad">

        <div class="stat"><b id="st-rides">0</b><span data-i18n="stUpcoming"></span></div>

        <span data-i18n="tabBoard"></span>

  <!-- New ride sheet -->
  <div class="sheet-bg" id="rideSheet" hidden>
    <form class="sheet pad" id="addForm" novalidate>
      <div class="grab"></div>
      <header><h2 class="h2" data-i18n="formTitle"></h2><button type="button" class="close" data-close data-i18n-aria="cancel">✕</button></header>
      <div class="fields">
        <label><span data-i18n="fTitle"></span><input id="f-title" maxlength="80" data-i18n-ph="fTitlePh" required></label>
        <div class="two">
          <label><span data-i18n="fSport"></span><select id="f-sport"></select></label>
          <label><span data-i18n="fLevel"></span><select id="f-level"></select></label>
        </div>
        <div class="two">
          <label><span data-i18n="fDate"></span><input id="f-date" type="date" required></label>
          <label><span data-i18n="fTime"></span><input id="f-time" type="time" value="05:30" required></label>
        </div>
        <label><span data-i18n="fEmirate"></span><select id="f-emirate"></select></label>
        <label><span data-i18n="fMeet"></span><input id="f-meet" maxlength="120" required></label>
        <div class="garmin" id="drop">
          <strong data-i18n="garminTitle"></strong>
          <p data-i18n="garminHelp"></p>
          <input id="f-gpx" type="file" accept=".gpx,application/gpx+xml,application/xml,text/xml">
          <p id="gpxInfo"></p>
        </div>

      <line class="grid" x1="${P}" y1="${H - 18}" x2="${W - P}" y2="${H - 18}"/>
      <path class="elev" d="${area}"/><path class="elev-line" d="${line}"/>
      <text class="lbl" x="${P}" y="${H - 4}" direction="ltr">${lo}–${hi} m</text>
      <text class="lbl" x="${W - P}" y="${H - 4}" text-anchor="end" direction="ltr">${Math.round(total * 10) / 10} km</text></svg>`;
  }

  // ---------- Rides ----------
  function riders(rideId) { return state.joins.filter((j) => j.rides && j.rides[rideId] === true).map((j) => j.id); }
  function visibleRides() {
    let list = state.mode === "live" ? state.rides : EXAMPLES;
    if (state.sport !== "all") list = list.filter((r) => sportOf(r) === state.sport);
    if (state.emirate !== "all") list = list.filter((r) => r.emirate === state.emirate);
    if (state.mine) list = list.filter((r) => riders(r.id).includes(state.me) || r.createdBy === state.me);
    return list;
  }
  function chips(opts, current, attr) {
    return opts.map((o) => `<button type="button" class="chip" ${attr}="${o}" aria-pressed="${o === current}">${esc(t(o))}</button>`).join("");
  }
  function renderStats() {
    const now = Date.now();
    const up = (state.mode === "live" ? state.rides : []).filter((r) => Date.parse(r.startAt) >= now);
    $("#st-rides").textContent = up.length;
    $("#st-km").textContent = Math.round(up.reduce((a, r) => a + (+r.distanceKm || 0), 0));
    $("#st-riders").textContent = up.reduce((a, r) => a + riders(r.id).length, 0);
  }
  function renderStatus() {
    const el = $("#status");
    let html = "";
    if (state.mode === "pending") html = esc(t("loading"));
    else if (state.mode === "example") html = t("exampleNote");
    else if (state.tab === "rides" && !state.rides.length) html = t("noRides");
    else if (state.tab === "market" && !state.listings.length) html = t("noListings");
    else if (!state.canWrite && state.tab !== "board") html = esc(t("readOnly"));
    el.innerHTML = html; el.hidden = !html;
    const fab = $("#fab");
    fab.hidden = !(state.mode === "live" && state.canWrite && state.tab !== "board");
    fab.setAttribute("aria-label", t(state.tab === "market" ? "sellA" : "newRideA"));
  }

  function fmtPace(m) { return `${Math.floor(m)}:${String(Math.round((m % 1) * 60)).padStart(2, "0")}`; }
  function rideCard(r) {
    const start = new Date(r.startAt);
    const past = start.getTime() < Date.now();
    const ids = riders(r.id);
    const joined = state.me && ids.includes(state.me);
    const full = r.maxRiders > 0 && ids.length >= r.maxRiders && !joined;
    const run = sportOf(r) === "run";
    const hours = run ? (r.paceMinKm ? r.distanceKm * r.paceMinKm / 60 : null) : (r.paceKmh ? r.distanceKm / r.paceKmh : null);
    const dur = hours ? `${Math.floor(hours)}:${String(Math.round((hours % 1) * 60)).padStart(2, "0")}` : "—";
    const paceTxt = run ? (r.paceMinKm ? fmtPace(r.paceMinKm) : "—") : (r.paceKmh || "—");
    const live = state.mode === "live";
    const meet = txt(r, "meet") ?? r.meetPoint;
    const maps = r.route?.length ? `https://www.google.com/maps/search/?api=1&query=${r.route[0][0]},${r.route[0][1]}` : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(meet + " " + t("em_" + r.emirate))}`;
    const count = r.maxRiders > 0 ? t("cntMax", { c: ids.length, n: r.maxRiders }) : ids.length === 1 ? t("cnt1") : t("cnt", { c: ids.length });
    const notes = txt(r, "notes");
    const open = !!state.open[r.id];
    const canJoin = live && state.canWrite && state.me && !past && !full;
    return `<article class="card ride ${run ? "run" : "bike"}${past ? " past" : ""}" data-id="${esc(r.id)}">
      <div class="top">
        <span class="tag">${esc(t(sportOf(r)))}</span><span>${esc(t("em_" + r.emirate))} · ${esc(t("lvl_" + r.level))}</span>
        ${r.example ? `<span class="badge">${esc(t("example"))}</span>` : ""}${past ? `<span class="badge muted">${esc(t("ended"))}</span>` : ""}
      </div>
      <h3>${esc(txt(r, "title"))}</h3>
      <p class="when">${esc(fmtDate.format(start))} · ${esc(fmtTime.format(start))}<br>${esc(meet)}</p>
      <div class="nums">
        <div><b>${esc(r.distanceKm)}</b><span>${esc(t("km"))}</span></div>
        <div><b>${esc(paceTxt)}</b><span>${esc(t(run ? "minkm" : "kmh"))}</span></div>
        <div><b>${esc(dur)}</b><span>${esc(t("dur"))}</span></div>
      </div>
      <div class="row">
        <div class="faces" data-faces="${esc(ids.slice(0, 6).join(","))}"></div>
        <span class="count">${esc(count)}${full && !past ? ` · <span class="full-tag">${esc(t("full"))}</span>` : ""}</span>
        ${canJoin ? `<button type="button" class="btn${joined ? " soft" : ""}" data-act="join">${esc(t(joined ? "leave" : "join"))}</button>` : ""}
      </div>
      <div class="links">
        <button type="button" class="linkbtn" data-act="toggle" aria-expanded="${open}">${esc(t(open ? "hide" : "details"))}</button>
        ${live ? `<button type="button" class="linkbtn" data-act="link">${esc(t("copyLink"))}</button>` : ""}
      </div>
      ${open ? `<div class="details">
        <div class="map">${routeSvg(r.route)}${elevSvg(r.route)}</div>
        ${r.gainM ? `<p class="sub">${esc(t("climb", { n: r.gainM }))}</p>` : ""}
        ${notes ? `<p class="notes">${esc(notes)}</p>` : ""}
        <div class="links">
          <a class="linkbtn" href="${esc(maps)}" target="_blank" rel="noopener">${esc(t("openMaps"))}</a>
          ${sample ? `<button type="button" class="linkbtn" data-act="ai">${esc(t("assistant"))}</button>` : ""}
          ${live && r.createdBy && r.createdBy === state.me ? `<button type="button" class="linkbtn danger" data-act="del">${esc(t("delRide"))}</button>` : ""}
        </div>
        ${state.ai[r.id] ? `<div class="ai" data-ai>${esc(state.ai[r.id])}</div>` : ""}
      </div>` : ""}
    </article>`;
  }

  function sportChips(current, attr) { return chips(["all", "bike", "run"], current, attr); }
  function renderRides() {
    $("#filters").innerHTML = sportChips(state.sport, "data-f") +
      (state.me ? `<button type="button" class="chip" data-mine aria-pressed="${state.mine}">${esc(t("mine"))}</button>` : "") +
      `<select class="chip" id="emirateFilter" aria-label="${esc(t("fEmirate"))}">` +
      `<option value="all">${esc(t("allEmirates"))}</option>` + EMIRATES.map((e) => `<option value="${e}"${e === state.emirate ? " selected" : ""}>${esc(t("em_" + e))}</option>`).join("") + `</select>`;
    renderStats();
    const now = Date.now();
    const list = visibleRides().slice().sort((a, b) => Date.parse(a.startAt) - Date.parse(b.startAt));
    const ordered = [...list.filter((r) => Date.parse(r.startAt) >= now), ...list.filter((r) => Date.parse(r.startAt) < now).reverse()];
    $("#rides").innerHTML = ordered.map(rideCard).join("") ||
      (state.mode === "live" && state.rides.length ? `<p class="notice">${esc(t("noMatch"))}</p>` : "");
    fillFaces();
    focusTarget();
  }

  function renderBoard() {
    $("#bFilters").innerHTML = sportChips(state.sport, "data-f");
    const totals = {};
    if (state.mode === "live") {
      const now = Date.now();
      for (const r of state.rides) {
        if (Date.parse(r.startAt) >= now) continue;
        if (state.sport !== "all" && sportOf(r) !== state.sport) continue;
        for (const id of riders(r.id)) {
          totals[id] ??= { km: 0, rides: 0 };
          totals[id].km += +r.distanceKm || 0; totals[id].rides += 1;
        }
      }
    }
    const rows = Object.entries(totals).sort((a, b) => b[1].km - a[1].km).slice(0, 20);
    $("#boardList").parentElement.hidden = !rows.length;
    $("#boardEmpty").hidden = !!rows.length;
    const list = $("#boardList");
    list.replaceChildren(...rows.map(([id, v], i) => {
      const li = document.createElement("li");
      li.dataset.uid = id;
      li.innerHTML = `<span class="rk">${i + 1}</span><img alt=""><span class="nm"></span><span class="km">${esc(t("boardRow", { km: Math.round(v.km), n: v.rides }))}</span>`;
      return li;
    }));
    if (user && rows.length) user.profiles(rows.map((r) => r[0])).then((ps) => {
      for (const li of list.children) {
        const p = ps[li.dataset.uid];
        li.querySelector("img").src = p?.avatarUrl || "";
        li.querySelector(".nm").textContent = (p?.isMe ? t("you") : p?.name) || t("member");
      }
    });
  }

  // Opens the ride named in the link (#<ride id>) once the rides arrive.
  let targetDone = false;
  function focusTarget() {
    if (targetDone || state.mode !== "live") return;
    targetDone = true;
    const id = location.hash.slice(1);
    if (!id || id === "market" || id === "ranking") return;
    const el = document.querySelector(`.ride[data-id="${CSS.escape(id)}"]`);
    if (!el) return;
    state.open[id] = true; renderRides();
    const again = document.querySelector(`.ride[data-id="${CSS.escape(id)}"]`);
    again.classList.add("target");
    again.scrollIntoView({ block: "center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  }

  async function copyText(text, btn, done) {
    try { await navigator.clipboard.writeText(text); btn.textContent = done; }
    catch { btn.textContent = text; btn.style.userSelect = "all"; }
  }

  async function fillFaces() {
    if (!user) return;
    const boxes = [...document.querySelectorAll("[data-faces]")].filter((b) => b.dataset.faces);
    const ids = [...new Set(boxes.flatMap((b) => b.dataset.faces.split(",")))];
    if (!ids.length) return;
    const ps = await user.profiles(ids);
    for (const b of boxes) {
      b.replaceChildren(...b.dataset.faces.split(",").map((id) => {
        const img = document.createElement("img");
        img.src = ps[id]?.avatarUrl || ""; img.alt = ps[id]?.name || t("member"); img.title = ps[id]?.name || t("member");
        return img;
      }));
    }
  }

  function queueWrite(fn) { writeChain = writeChain.then(fn, fn); return writeChain; }

  async function toggleJoin(rideId) {
    if (!db || !state.me) return;
    const mine = state.joins.find((j) => j.id === state.me);
    const on = !(mine?.rides?.[rideId] === true);
    const ref = db.doc("joins/" + state.me);
    try {
      await queueWrite(() => mine ? ref.update({ rides: { [rideId]: on } }) : ref.set({ rides: { [rideId]: on } }));
    } catch (e) { flash(t(e.code === "invalid_argument" ? "errJoinPerm" : "errSave")); }
  }

  async function confirmThen(btn, fn) {
    if (btn.dataset.confirm !== "1") { btn.dataset.confirm = "1"; btn.textContent = t("confirmDel"); return; }
    try { await fn(); } catch { flash(t("errDel")); }
  }

  async function askAi(r, btn) {
    btn.disabled = true;
    state.ai[r.id] = t("thinking"); renderRides();
    const start = new Date(r.startAt);
    const run = sportOf(r) === "run";
    const prompt = `You help a UAE ${run ? "running" : "cycling"} group called Yalla Crew. Write 6 short bullet points to prepare for this ${run ? "run" : "ride"}: water and fuelling for UAE heat at this start time, gear, splitting into ${run ? "pace" : "speed"} groups, and road safety. Reply in ${t("aiLang")}. Plain text, no Markdown, each point on its own line starting with "•".

Sport: ${run ? "running" : "cycling"}
Title: ${txt(r, "title")}
Emirate: ${I18N.en["em_" + r.emirate]}
Meeting point: ${txt(r, "meet") ?? r.meetPoint}
When: ${start.toString()}
Distance: ${r.distanceKm} km; ${run ? `pace ${r.paceMinKm || "not set"} min/km` : `average speed ${r.paceKmh || "not set"} km/h`}; climb ${r.gainM || "unknown"} m
Level: ${I18N.en["lvl_" + r.level]}
Organiser notes: ${txt(r, "notes") || "none"}`;
    try {
      const { text } = await sample(prompt, { modelTier: "quick", onText: ({ text }) => {
        state.ai[r.id] = text;
        const box = document.querySelector(`.ride[data-id="${CSS.escape(r.id)}"] [data-ai]`);
        if (box) box.textContent = text;
      } });
      state.ai[r.id] = text;
    } catch (e) {
      if (["not_granted", "sampling_disabled", "capability_disabled", "not_declared"].includes(e.code)) { sample = null; delete state.ai[r.id]; }
      else state.ai[r.id] = e.text || t(e.code === "rate_limited" ? "rateLimit" : "aiFail");
    }
    renderRides();
  }

  // ---------- Market ----------
  function waDigits(phone) {
    let d = String(phone || "").replace(/\D/g, "");
    if (d.startsWith("00")) d = d.slice(2);
    if (d.length === 10 && d.startsWith("05")) d = "971" + d.slice(1);   // UAE mobile written locally
    return d;
  }
  function visibleListings() {
    let list = state.mode === "live" ? state.listings : EXAMPLE_ITEMS;
    const m = state.m;
    if (m.sport !== "all") list = list.filter((x) => x.sport === m.sport || x.sport === "both");
    if (m.cat !== "all") list = list.filter((x) => x.category === m.cat);
    if (m.q) { const q = m.q.toLowerCase(); list = list.filter((x) => (txt(x, "title") + " " + (txt(x, "desc") || "")).toLowerCase().includes(q)); }
    return list.slice().sort((a, b) => (a.sold ? 1 : 0) - (b.sold ? 1 : 0) || String(b.createdAt || "").localeCompare(String(a.createdAt || "")));
  }
  function itemCard(x) {
    const mine = state.mode === "live" && x.sellerId && x.sellerId === state.me;
    const photo = x.photo ? `<img src="/_blob/${esc(x.photo)}" alt="${esc(txt(x, "title"))}" loading="lazy" data-ph>` : esc(t("noPhoto"));
    const wa = waDigits(x.phone);
    const sp = x.sport === "both" ? "both" : x.sport === "run" ? "run" : "bike";
    const desc = txt(x, "desc");
    return `<article class="card item ${sp}${x.sold ? " sold" : ""}" data-id="${esc(x.id)}">
      <div class="ph">${photo}${x.sold ? `<span class="badge sold">${esc(t("sold"))}</span>` : x.example ? `<span class="badge">${esc(t("example"))}</span>` : ""}</div>
      <div class="body">
        <div class="price">${esc(Number(x.price).toLocaleString(I18N[lang].locale))} <small>${esc(t("aed"))}</small></div>
        <h3>${esc(txt(x, "title"))}</h3>
        <span class="tag">${esc(t(sp))}</span>
        <div class="meta">${esc(t("cat_" + x.category))} · ${esc(t("cond_" + x.condition))} · ${esc(t("em_" + x.emirate))}</div>
        ${desc ? `<p class="desc">${esc(desc)}</p>` : ""}
        ${x.sold ? "" : `<div class="contact"><span class="num">${esc(x.phone)}</span><div class="acts">
          ${wa.length >= 8 && !x.example ? `<a class="wa" href="https://wa.me/${wa}" target="_blank" rel="noopener">${esc(t("whatsapp"))}</a>` : ""}
          <button type="button" class="cp" data-act="copynum">${esc(t("copyNum"))}</button></div></div>`}
        ${mine ? `<div class="links" style="margin-top:6px">
          <button type="button" class="linkbtn" data-act="sold">${esc(t(x.sold ? "markAvail" : "markSold"))}</button>
          <button type="button" class="linkbtn danger" data-act="delItem">${esc(t("delAd"))}</button></div>` : ""}
      </div>
    </article>`;
  }
  function renderMarket() {
    $("#mFilters").innerHTML = sportChips(state.m.sport, "data-f") +
      `<select class="chip" id="mCat" aria-label="${esc(t("sCat"))}"><option value="all">${esc(t("allCats"))}</option>` +
      CATS.map((c) => `<option value="${c}"${c === state.m.cat ? " selected" : ""}>${esc(t("cat_" + c))}</option>`).join("") + `</select>`;
    const list = visibleListings();
    $("#market").innerHTML = list.map(itemCard).join("") ||
      (state.mode === "live" && state.listings.length ? `<p class="notice" style="grid-column:1/-1">${esc(t("noMatch"))}</p>` : "");
    for (const img of document.querySelectorAll("#market img[data-ph]")) img.addEventListener("error", () => { img.src = PH; }, { once: true });
  }

  function render() {
    renderStatus();
    for (const id of ["rides", "market", "board"]) $("#tab-" + id).hidden = state.tab !== id;
    for (const b of document.querySelectorAll("[data-tab]")) {
      if (b.dataset.tab === state.tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
    }
    if (state.tab === "rides") renderRides(); else if (state.tab === "market") renderMarket(); else renderBoard();
  }

  function flash(msg) { const el = $("#status"); el.textContent = msg; el.hidden = false; }

  // ---------- Sheets ----------
  let lastFocus = null;
  function openSheet(id, focusSel) {
    lastFocus = document.activeElement;
    $(id).hidden = false;
    document.body.style.overflow = "hidden";
    setTimeout(() => $(focusSel)?.focus(), 50);
  }
  function closeSheets() {
    for (const s of document.querySelectorAll(".sheet-bg")) s.hidden = true;
    document.body.style.overflow = "";
    $("#formErr").textContent = ""; $("#sellErr").textContent = "";
    lastFocus?.focus?.();
  }
  for (const s of document.querySelectorAll(".sheet-bg")) s.addEventListener("click", (e) => { if (e.target === s || e.target.closest("[data-close]")) closeSheets(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheets(); });

  // ---------- Language ----------
  function options(sel, keys, prefix) {
    const el = $(sel), cur = el.value;
    el.innerHTML = keys.map((k) => `<option value="${k}">${esc(t(prefix + k))}</option>`).join("");
    if (cur && keys.includes(cur)) el.value = cur;
  }
  function applyLang() {
    const app = $("#app"), L = I18N[lang];
    app.lang = lang; app.dir = L.dir;
    $("#langSel").value = lang;
    fmtDate = new Intl.DateTimeFormat(L.locale, { weekday: "short", day: "numeric", month: "short" });
    fmtTime = new Intl.DateTimeFormat(L.locale, { hour: "numeric", minute: "2-digit" });
    for (const el of document.querySelectorAll("[data-i18n]")) el.textContent = t(el.dataset.i18n);
    for (const el of document.querySelectorAll("[data-i18n-ph]")) el.placeholder = t(el.dataset.i18nPh);
    for (const el of document.querySelectorAll("[data-i18n-aria]")) el.setAttribute("aria-label", t(el.dataset.i18nAria));
    options("#f-sport", ["bike", "run"], "");
    options("#s-sport", ["bike", "run", "both"], "");
    options("#f-emirate", EMIRATES, "em_");
    options("#s-emirate", EMIRATES, "em_");
    options("#f-level", LEVELS, "lvl_");
    options("#s-cat", CATS, "cat_");
    options("#s-cond", CONDS, "cond_");
    if (!$("#f-emirate").dataset.init) { $("#f-emirate").value = "DXB"; $("#s-emirate").value = "DXB"; $("#f-level").value = "int"; $("#s-cond").value = "likenew"; $("#f-emirate").dataset.init = 1; }
    syncPace(false);
    render();
  }
  $("#langSel").addEventListener("change", (e) => {
    lang = e.target.value;
    try { localStorage.setItem("yc-lang", lang); } catch {}
    applyLang();
  });

  // ---------- Events ----------
  for (const b of document.querySelectorAll("[data-tab]")) b.addEventListener("click", () => { state.tab = b.dataset.tab; render(); scrollTo({ top: 0 }); });

  $("#fab").addEventListener("click", () => {
    if (state.tab === "market") {
      $("#s-photo-wrap").hidden = !assets; $("#s-photo-off").hidden = !!assets;
      openSheet("#sellSheet", "#s-title");
    } else {
      if (!$("#f-date").value) $("#f-date").value = nextFriday().slice(0, 10);
      openSheet("#rideSheet", "#f-title");
    }
  });

  $("#filters").addEventListener("click", (e) => {
    const b = e.target.closest("[data-f], [data-mine]"); if (!b) return;
    if (b.hasAttribute("data-mine")) state.mine = !state.mine; else state.sport = b.dataset.f;
    renderRides();
  });
  $("#filters").addEventListener("change", (e) => { if (e.target.id === "emirateFilter") { state.emirate = e.target.value; renderRides(); } });
  $("#bFilters").addEventListener("click", (e) => {
    const b = e.target.closest("[data-f]"); if (!b) return;
    state.sport = b.dataset.f; renderBoard();
  });
  $("#rides").addEventListener("click", (e) => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    const id = b.closest(".ride").dataset.id;
    const r = (state.mode === "live" ? state.rides : EXAMPLES).find((x) => x.id === id);
    const act = b.dataset.act;
    if (act === "toggle") { state.open[id] = !state.open[id]; renderRides(); }
    else if (act === "join") toggleJoin(id);
    else if (act === "del") confirmThen(b, () => db.doc("rides/" + id).delete());
    else if (act === "link") copyText(ARTIFACT + "#" + id, b, t("copied"));
    else if (act === "ai" && r) askAi(r, b);
  });

  $("#mFilters").addEventListener("click", (e) => {
    const b = e.target.closest("[data-f]"); if (!b) return;
    state.m.sport = b.dataset.f; renderMarket();
  });
  $("#mFilters").addEventListener("change", (e) => { if (e.target.id === "mCat") { state.m.cat = e.target.value; renderMarket(); } });
  $("#mSearch").addEventListener("input", (e) => { state.m.q = e.target.value.trim(); renderMarket(); });
  $("#market").addEventListener("click", async (e) => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    const id = b.closest(".item").dataset.id;
    const x = (state.mode === "live" ? state.listings : EXAMPLE_ITEMS).find((i) => i.id === id);
    if (!x) return;
    if (b.dataset.act === "copynum") copyText(x.phone, b, t("copiedNum"));
    else if (b.dataset.act === "sold") {
      b.disabled = true;
      try { await db.doc("listings/" + id).update({ sold: !x.sold }); } catch { flash(t("errSave")); b.disabled = false; }
    } else if (b.dataset.act === "delItem") confirmThen(b, async () => {
      await db.doc("listings/" + id).delete();
      if (x.photo && assets) assets.delete(x.photo).catch(() => {});
    });
  });

  // Ride form
  const form = $("#addForm");
  function syncPace(reset = true) {
    const pace = $("#f-pace"), run = $("#f-sport").value === "run";
    $("#paceLbl").textContent = t(run ? "fPace" : "fSpeed");
    $("#f-meet").placeholder = t(run ? "fMeetPh_run" : "fMeetPh_bike");
    if (!reset) return;
    if (run) { pace.min = 3; pace.max = 12; pace.step = 0.25; pace.value = 6; }
    else { pace.min = 10; pace.max = 50; pace.step = 1; pace.value = 28; }
  }
  $("#f-sport").addEventListener("change", () => syncPace(true));

  async function takeGpx(file) {
    const info = $("#gpxInfo");
    try {
      const g = parseGpx(await file.text());
      state.gpx = g;
      $("#f-km").value = g.km;
      if (!$("#f-title").value && g.name) $("#f-title").value = g.name.slice(0, 80);
      info.className = "ok";
      info.textContent = t("gpxOk", { km: g.km, gain: g.gain, n: g.route.length });
    } catch (err) {
      state.gpx = null; info.className = "err"; info.textContent = err.message || t("gpxBad");
    }
  }
  $("#f-gpx").addEventListener("change", (e) => { const f = e.target.files[0]; if (f) takeGpx(f); });
  const drop = $("#drop");
  drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("drag"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("drag"));
  drop.addEventListener("drop", (e) => { e.preventDefault(); drop.classList.remove("drag"); const f = e.dataTransfer.files[0]; if (f) takeGpx(f); });

  const writeErr = (ex) => t(ex.code === "invalid_argument" ? "errPerm" : ex.code === "quota_exceeded" ? "errQuota" : "errSave");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const err = $("#formErr");
    const title = $("#f-title").value.trim(), meet = $("#f-meet").value.trim();
    const km = parseFloat($("#f-km").value), pace = parseFloat($("#f-pace").value), max = parseInt($("#f-max").value, 10);
    const date = $("#f-date").value, time = $("#f-time").value;
    if (!title || !meet || !date || !time) { err.textContent = t("errRequired"); return; }
    if (!(km > 0)) { err.textContent = t("errKm"); return; }
    const startAt = new Date(`${date}T${time}`);
    if (isNaN(startAt)) { err.textContent = t("errDate"); return; }
    err.textContent = "";
    const btn = $("#saveBtn"); btn.disabled = true;
    try {
      const sport = $("#f-sport").value;
      await db.collection("rides").add({
        sport, title, meetPoint: meet, emirate: $("#f-emirate").value, level: $("#f-level").value,
        startAt: startAt.toISOString(), distanceKm: Math.round(km * 10) / 10,
        paceKmh: sport === "bike" && pace > 0 ? Math.round(pace) : null,
        paceMinKm: sport === "run" && pace > 0 ? Math.round(pace * 4) / 4 : null,
        gainM: state.gpx?.gain ?? null, maxRiders: max >= 2 ? max : null,
        notes: $("#f-notes").value.trim(), route: state.gpx?.route ?? [],
        createdBy: state.me, createdAt: new Date().toISOString()
      });
      form.reset(); syncPace(true); state.gpx = null; $("#gpxInfo").textContent = ""; closeSheets();
    } catch (ex) { err.textContent = writeErr(ex); }
    finally { btn.disabled = false; }
  });

  // Sell form
  const sellForm = $("#sellForm");
  sellForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const err = $("#sellErr");
    const title = $("#s-title").value.trim(), phone = $("#s-phone").value.trim(), price = parseFloat($("#s-price").value);
    if (!title || !phone || !(price >= 0)) { err.textContent = t("errSellReq"); return; }
    if (waDigits(phone).length < 8 || waDigits(phone).length > 15) { err.textContent = t("errPhone"); return; }
    err.textContent = "";
    const btn = $("#sellBtn"); btn.disabled = true;
    let photo = null;
    try {
      const file = $("#s-photo").files[0];
      if (file && assets) {
        err.textContent = t("uploading");
        try { photo = (await assets.upload(file)).id; err.textContent = ""; }
        catch { err.textContent = t("errPhoto"); btn.disabled = false; return; }
      }
      await db.collection("listings").add({
        title, sport: $("#s-sport").value, category: $("#s-cat").value, condition: $("#s-cond").value,
        price: Math.round(price), emirate: $("#s-emirate").value, phone,
        description: $("#s-desc").value.trim(), photo, sold: false,
        sellerId: state.me, createdAt: new Date().toISOString()
      });
      sellForm.reset(); closeSheets();
    } catch (ex) { err.textContent = writeErr(ex); }
    finally { btn.disabled = false; }
  });

  // ---------- Boot ----------
  applyLang();
  (async () => {
    if (!window.claude?.use) { state.mode = "example"; render(); return; }
    [db, user, sample, assets] = await Promise.all(["db", "user", "sample", "assets"].map((n) => claude.use(n)));
    if (!db) { state.mode = "example"; render(); return; }
    state.me = user ? await user.id() : null;
    const cw = user ? await user.can("data.write") : null;
    state.canWrite = cw !== false && !!state.me;
    const fail = (e) => { if (e.code === "revoked") { db = null; state.mode = "example"; render(); } else flash(t("disconnected")); };
    db.collection("rides").orderBy("startAt").onSnapshot((s) => {
      state.rides = s.docs.map((d) => ({ id: d.id, ...d.data() }));
      state.mode = "live"; render();
    }, fail);
    db.collection("joins").onSnapshot((s) => {
      state.joins = s.docs.map((d) => ({ id: d.id, ...d.data() }));
      if (state.tab !== "market") render();
    }, fail);
    db.collection("listings").onSnapshot((s) => {
      state.listings = s.docs.map((d) => ({ id: d.id, ...d.data(), desc: d.data().description }));
      if (state.mode === "live" && state.tab === "market") render();
    }, fail);
  })();
})();
</script>
