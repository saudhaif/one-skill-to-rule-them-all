<title>YALLA CREW · يلا كرو</title>

<style>
/* Layout: sunset sky with UAE landmark silhouettes, language switch and tabs; below, ride cards (details + route map) or a market grid. */
:root {
  --bg: #f2f4f9;
  --surface: #ffffff;
  --ink: #0d1322;
  --muted: #566078;
  --line: #d9dfec;
  --accent: #ff4d1a;        /* race orange: buttons, running */
  --accent-ink: #ffffff;
  --bike: #1b5cff;          /* electric blue: cycling */
  --run: #ff4d1a;
  --volt: #c4f22e;          /* finish-line highlight */
  --volt-ink: #0d1322;
  --sky-top: #ffd7b0;
  --sky-mid: #ff9f68;
  --sun: #ff6a2b;
  --shadow: #10172a;        /* landmark silhouettes */
  --shadow-far: #10172a;
  --danger: #c22a1f;
  --font-display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  --font-body: "Barlow", "Segoe UI", Arial, sans-serif;
  --font-data: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #090d18; --surface: #111a2d; --ink: #eef1f8; --muted: #98a2bb; --line: #222c45;
    --accent: #ff6a3d; --accent-ink: #160803; --bike: #5a8bff; --run: #ff6a3d; --volt: #c9f53c; --volt-ink: #0d1322;
    --sky-top: #1b1430; --sky-mid: #6b2a24; --sun: #ff7a3d; --shadow: #03050b; --shadow-far: #03050b; --danger: #ff7b70;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #090d18; --surface: #111a2d; --ink: #eef1f8; --muted: #98a2bb; --line: #222c45;
  --accent: #ff6a3d; --accent-ink: #160803; --bike: #5a8bff; --run: #ff6a3d; --volt: #c9f53c; --volt-ink: #0d1322;
  --sky-top: #1b1430; --sky-mid: #6b2a24; --sun: #ff7a3d; --shadow: #03050b; --shadow-far: #03050b; --danger: #ff7b70;
  color-scheme: dark;
}
[lang="ar"] { --font-display: "Lalezar", "IBM Plex Sans Arabic", Tahoma, sans-serif; --font-body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif; }
[lang="hi"] { --font-display: "Teko", "Hind", "Nirmala UI", sans-serif; --font-body: "Hind", "Nirmala UI", "Segoe UI", sans-serif; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 15px/1.6 var(--font-body); }
#app { font-family: var(--font-body); }
.wrap { max-width: 1020px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.mast { background: linear-gradient(to bottom, var(--sky-top), var(--sky-mid) 78%, var(--sky-mid)); position: relative; }
.mast .wrap { padding-block: 22px 0; display: grid; gap: 6px; }
.toprow { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand h1 { margin: 0; font: 700 italic clamp(34px, 7vw, 54px)/1 "Barlow Condensed", "Arial Narrow", sans-serif; letter-spacing: .02em; text-transform: uppercase; color: var(--shadow); }
.brand .ar { font: 400 clamp(24px, 5vw, 34px)/1 "Lalezar", "IBM Plex Sans Arabic", sans-serif; color: var(--shadow); }
:root[data-theme="dark"] .brand h1, :root[data-theme="dark"] .brand .ar { color: var(--ink); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .brand h1, :root:not([data-theme="light"]) .brand .ar { color: var(--ink); } }
.langs { display: flex; gap: 4px; background: color-mix(in srgb, var(--surface) 70%, transparent); border-radius: 999px; padding: 3px; }
.langs button { border: 0; background: transparent; color: var(--ink); font: 600 13px var(--font-body); padding: 4px 11px; border-radius: 999px; cursor: pointer; }
.langs button[aria-pressed="true"] { background: var(--accent); color: #ffffff; }
.tag { margin: 0; color: var(--ink); max-width: 62ch; font-weight: 500; }
.skyline { display: block; width: 100%; height: auto; margin-top: 4px; }
.skyline .sun { fill: var(--sun); }
.skyline .far { fill: var(--shadow-far); opacity: .28; }
.skyline .near { fill: var(--shadow); }
.skyline .stroke { fill: none; stroke: var(--shadow); }
.tabs { display: flex; gap: 0; background: var(--shadow); }
.tabs .wrap { display: flex; gap: 10px; padding-block: 10px; }
.tabs button { flex: 1 1 0; max-width: 220px; border: 2px solid #ffffff; background: transparent; color: #ffffff; font: 700 20px/1 var(--font-display); letter-spacing: .03em; text-transform: uppercase; padding: 12px 18px 10px; border-radius: 999px; cursor: pointer; }
.tabs button:hover { background: rgba(255, 255, 255, .12); }
.tabs button[aria-selected="true"] { background: var(--volt); border-color: var(--volt); color: #0d1322; }
main .wrap { padding-block: 22px 44px; display: grid; gap: 20px; }
.tabpanel { display: grid; gap: 20px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--surface); border-radius: var(--r); padding: 12px 14px; border-top: 4px solid var(--accent); }
.stat:nth-child(2) { border-top-color: var(--bike); }
.stat:nth-child(3) { border-top-color: var(--volt); }
.stat b { display: block; font: 700 30px/1.1 var(--font-data); font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 13px; }
.bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chip { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 5px 13px; font: 600 13px var(--font-body); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.chip[data-f="bike"][aria-pressed="true"] { background: var(--bike); border-color: var(--bike); color: #fff; }
.chip[data-f="run"][aria-pressed="true"] { background: var(--run); border-color: var(--run); color: #fff; }
.spacer { flex: 1; }
button.primary { border: 0; border-radius: 8px; padding: 9px 16px; font: 700 14px var(--font-body); cursor: pointer; background: var(--accent); color: var(--accent-ink); }
button.ghost { border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 8px; padding: 8px 14px; font: 600 14px var(--font-body); cursor: pointer; }
button.link { border: 0; background: none; color: var(--danger); font: inherit; font-size: 13px; cursor: pointer; padding: 0; }
button:focus-visible, .chip:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible { outline: 3px solid var(--volt); outline-offset: 2px; }
button:disabled { opacity: .55; cursor: default; }
select.mini { width: auto; padding: 5px 10px; font-size: 13px; border-radius: 999px; background: var(--surface); }
input.search { width: auto; flex: 1 1 180px; padding: 6px 12px; border-radius: 999px; background: var(--surface); font-size: 14px; }
.notice { border: 1px dashed var(--line); border-radius: var(--r); padding: 14px 16px; color: var(--muted); background: var(--surface); }
.notice strong { color: var(--ink); }
.rides { display: grid; gap: 16px; }
.ride { background: var(--surface); border-radius: var(--r); display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); overflow: hidden; border-inline-start: 6px solid var(--bike); --sport: var(--bike); }
.ride.run { border-inline-start-color: var(--run); --sport: var(--run); }
.ride.past { opacity: .7; }
.ride.target { box-shadow: 0 0 0 3px var(--volt); }
.ride .info { padding: 16px 18px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.ride h3 { margin: 0; font: 700 24px/1.15 var(--font-display); text-wrap: balance; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: 13px; align-items: center; }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink); }
.pill.sport { background: var(--sport); border-color: var(--sport); color: #fff; }
.pill.example { background: var(--volt); border-color: var(--volt); color: var(--volt-ink); }
.pill.done { color: var(--muted); }
.nums { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; border-block: 1px solid var(--line); padding-block: 10px; }
.nums div { display: grid; }
.nums b { font: 700 26px/1.1 var(--font-data); font-variant-numeric: tabular-nums; color: var(--sport); }
.nums span { font-size: 12px; color: var(--muted); }
.notes { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.crew { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.faces { display: flex; }
.faces img { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--surface); margin-inline-start: -8px; background: var(--line); }
.faces img:first-child { margin-inline-start: 0; }
.crew .count { font-size: 13px; color: var(--muted); }
.full-tag { color: var(--danger); font-size: 13px; font-weight: 600; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.ai { border-inline-start: 3px solid var(--sport); padding: 8px 12px; background: var(--bg); border-radius: 6px; white-space: pre-wrap; font-size: 14px; overflow-wrap: anywhere; }
.map { background: var(--bg); display: grid; align-content: center; padding: 10px; min-width: 0; }
.map svg { width: 100%; height: auto; display: block; }
.map .grid { stroke: var(--line); stroke-width: 1; }
.map .route { fill: none; stroke: var(--sport); stroke-width: 3.5; stroke-linejoin: round; stroke-linecap: round; }
.map .start { fill: var(--volt); stroke: var(--ink); stroke-width: 1.5; }
.map .end { fill: var(--ink); }
.map .lbl { fill: var(--muted); font: 600 11px var(--font-data); }
.map .scale { stroke: var(--ink); stroke-width: 2; }
.map .empty { fill: var(--muted); font: 13px var(--font-body); }
.map .elev { fill: var(--sport); opacity: .2; }
.map .elev-line { fill: none; stroke: var(--sport); stroke-width: 1.5; }
.map a { font-size: 12px; color: var(--sport); justify-self: start; margin-top: 4px; font-weight: 600; }
form.add { background: var(--surface); border-radius: var(--r); padding: 18px; display: grid; gap: 14px; border-top: 4px solid var(--accent); }
form.add h2 { margin: 0; font: 700 24px var(--font-display); }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.fields .full { grid-column: 1 / -1; }
label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
input, select, textarea { font: 15px var(--font-body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; }
textarea { min-height: 70px; resize: vertical; }
.garmin { border: 1px dashed var(--bike); border-radius: 8px; padding: 12px; display: grid; gap: 6px; }
.garmin.drag { background: var(--bg); }
.garmin p { margin: 0; font-size: 13px; color: var(--muted); }
.garmin .ok { color: var(--bike); font-weight: 600; }
.err { color: var(--danger); font-size: 13px; min-height: 1em; margin: 0; }
.board { background: var(--surface); border-radius: var(--r); padding: 16px 18px; display: grid; gap: 10px; border-top: 4px solid var(--volt); }
.board h2 { margin: 0; font: 700 24px var(--font-display); }
.board p { margin: 0; color: var(--muted); font-size: 13px; }
.board ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.board li { display: grid; grid-template-columns: 2.5ch 28px minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.board li .rk { font: 700 18px var(--font-data); color: var(--muted); }
.board li:first-child .rk { color: var(--accent); }
.board li img { width: 28px; height: 28px; border-radius: 50%; background: var(--line); }
.board li .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.board li .km { font: 700 16px var(--font-data); font-variant-numeric: tabular-nums; }
.market { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.item { background: var(--surface); border-radius: var(--r); overflow: hidden; display: grid; grid-template-rows: auto 1fr; min-width: 0; }
.item.sold { opacity: .6; }
.item .ph { aspect-ratio: 4 / 3; max-width: 100%; background: var(--bg); display: grid; place-items: center; color: var(--muted); font-size: 13px; position: relative; }
.item .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.item .ph .badge { position: absolute; inset-inline-start: 8px; top: 8px; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; }
.item .ph .badge.sold { background: var(--danger); color: #fff; }
.item .ph .badge.example { background: var(--volt); color: var(--volt-ink); }
.item .body { padding: 12px 14px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.item h3 { margin: 0; font: 600 16px/1.35 var(--font-body); overflow-wrap: anywhere; }
.item .price { font: 700 24px/1.1 var(--font-data); font-variant-numeric: tabular-nums; color: var(--accent); }
.item .price small { font: 600 13px var(--font-body); color: var(--muted); }
.item .desc { margin: 0; font-size: 13px; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
.item .pill.bike { background: var(--bike); border-color: var(--bike); color: #fff; }
.item .pill.run { background: var(--run); border-color: var(--run); color: #fff; }
.item .pill.both { background: linear-gradient(90deg, var(--bike), var(--run)); border-color: transparent; color: #fff; }
.contact { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; }
.contact .num { font: 600 15px var(--font-data); direction: ltr; unicode-bidi: isolate; user-select: all; }
.contact a { color: var(--bike); font-weight: 600; }
.contact button { border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 6px; padding: 2px 8px; font: 600 12px var(--font-body); cursor: pointer; }
footer { color: var(--muted); font-size: 12px; padding-block: 0 32px; }
@media (max-width: 720px) {
  .ride { grid-template-columns: minmax(0, 1fr); }
  .fields { grid-template-columns: minmax(0, 1fr); }
  .stat b { font-size: 24px; }
  .tabs button { font-size: 18px; padding-inline: 12px; max-width: none; }
}
</style>

      <path class="elev" d="${area}"/><path class="elev-line" d="${line}"/>
      <text class="lbl" x="${P}" y="${H - 4}" direction="ltr">${lo}–${hi} m</text>
      <text class="lbl" x="${W - P}" y="${H - 4}" text-anchor="end" direction="ltr">${Math.round(total * 10) / 10} km</text></svg>`;
  }

  // ---------- Rides ----------
  function riders(rideId) { return state.joins.filter((j) => j.rides && j.rides[rideId] === true).map((j) => j.id); }
  function visibleRides() {
    let list = state.mode === "live" ? state.rides : EXAMPLES;
    if (state.sport !== "all") list = list.filter((r) => sportOf(r) === state.sport);
    if (state.emirate !== "all") list = list.filter((r) => r.emirate === state.emirate);
    if (state.mine) list = list.filter((r) => riders(r.id).includes(state.me) || r.createdBy === state.me);
    return list;
  }
  function chips(opts, current, attr) {
    return opts.map((o) => `<button type="button" class="chip" ${attr}="${o}" aria-pressed="${o === current}">${esc(t(o))}</button>`).join("");
  }
  function renderStats() {
    const now = Date.now();
    const up = (state.mode === "live" ? state.rides : []).filter((r) => Date.parse(r.startAt) >= now);
    $("#st-rides").textContent = up.length;
    $("#st-km").textContent = Math.round(up.reduce((a, r) => a + (+r.distanceKm || 0), 0));
    $("#st-riders").textContent = up.reduce((a, r) => a + riders(r.id).length, 0);
  }
  function renderStatus() {
    const el = $("#status");
    let html = "";
    if (state.mode === "pending") html = esc(t("loading"));
    else if (state.mode === "example") html = t("exampleNote");
    else if (state.tab === "rides" && !state.rides.length) html = t("noRides");
    else if (state.tab === "market" && !state.listings.length) html = t("noListings");
    else if (!state.canWrite) html = esc(t("readOnly"));
    el.innerHTML = html; el.hidden = !html;
    const canAct = state.mode === "live" && state.canWrite;
    $("#openForm").hidden = !canAct;
    $("#openSell").hidden = !canAct;
  }

  function fmtPace(m) { return `${Math.floor(m)}:${String(Math.round((m % 1) * 60)).padStart(2, "0")}`; }
  function rideCard(r) {
    const start = new Date(r.startAt);
    const past = start.getTime() < Date.now();
    const ids = riders(r.id);
    const joined = state.me && ids.includes(state.me);
    const full = r.maxRiders > 0 && ids.length >= r.maxRiders && !joined;
    const run = sportOf(r) === "run";
    const hours = run ? (r.paceMinKm ? r.distanceKm * r.paceMinKm / 60 : null) : (r.paceKmh ? r.distanceKm / r.paceKmh : null);
    const dur = hours ? `${Math.floor(hours)}:${String(Math.round((hours % 1) * 60)).padStart(2, "0")}` : "—";
    const paceTxt = run ? (r.paceMinKm ? fmtPace(r.paceMinKm) : "—") : (r.paceKmh || "—");
    const live = state.mode === "live";
    const meet = txt(r, "meet") ?? r.meetPoint;
    const maps = r.route?.length ? `https://www.google.com/maps/search/?api=1&query=${r.route[0][0]},${r.route[0][1]}` : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(meet + " " + t("em_" + r.emirate))}`;
    const count = r.maxRiders > 0 ? t("cntMax", { c: ids.length, n: r.maxRiders }) : ids.length === 1 ? t("cnt1") : t("cnt", { c: ids.length });
    const notes = txt(r, "notes");
    return `<article class="ride ${run ? "run" : "bike"}${past ? " past" : ""}" data-id="${esc(r.id)}">
      <div class="info">
        <div class="meta">
          <span class="pill sport">${esc(t(sportOf(r)))}</span><span class="pill">${esc(t("em_" + r.emirate))}</span><span class="pill">${esc(t("lvl_" + r.level))}</span>
          ${r.example ? `<span class="pill example">${esc(t("example"))}</span>` : ""}${past ? `<span class="pill done">${esc(t("ended"))}</span>` : ""}
        </div>
        <h3>${esc(txt(r, "title"))}</h3>
        <div class="meta"><span>${esc(fmtDate.format(start))} · ${esc(fmtTime.format(start))}</span><span>${esc(t("meetAt", { p: meet }))}</span></div>
        <div class="nums">
          <div><b>${esc(r.distanceKm)}</b><span>${esc(t("km"))}</span></div>
          <div><b>${esc(paceTxt)}</b><span>${esc(t(run ? "minkm" : "kmh"))}</span></div>
          <div><b>${esc(dur)}</b><span>${esc(t("dur"))}${r.gainM ? " · " + esc(t("climb", { n: r.gainM })) : ""}</span></div>
        </div>
        ${notes ? `<p class="notes">${esc(notes)}</p>` : ""}
        <div class="crew">
          <div class="faces" data-faces="${esc(ids.slice(0, 8).join(","))}"></div>
          <span class="count">${esc(count)}</span>
          ${full && !past ? `<span class="full-tag">${esc(t("full"))}</span>` : ""}
        </div>
        <div class="actions">
          ${live && state.canWrite && state.me && !past && !full ? `<button type="button" class="${joined ? "ghost" : "primary"}" data-act="join">${esc(t(joined ? "leave" : "join"))}</button>` : ""}
          ${live ? `<button type="button" class="ghost" data-act="link">${esc(t("copyLink"))}</button>` : ""}
          ${sample ? `<button type="button" class="ghost" data-act="ai">${esc(t("assistant"))}</button>` : ""}
          ${live && r.createdBy && r.createdBy === state.me ? `<button type="button" class="link" data-act="del">${esc(t("delRide"))}</button>` : ""}
        </div>
        ${state.ai[r.id] ? `<div class="ai" data-ai>${esc(state.ai[r.id])}</div>` : ""}
      </div>
      <div class="map">${routeSvg(r.route)}${elevSvg(r.route)}<a href="${esc(maps)}" target="_blank" rel="noopener">${esc(t("openMaps"))}</a></div>
    </article>`;
  }

  function renderRides() {
    $("#filters").innerHTML = chips(["all", "bike", "run"], state.sport, "data-f") +
      (state.me ? `<button type="button" class="chip" data-mine aria-pressed="${state.mine}">${esc(t("mine"))}</button>` : "");
    renderStats();
    const now = Date.now();
    const list = visibleRides().slice().sort((a, b) => Date.parse(a.startAt) - Date.parse(b.startAt));
    const ordered = [...list.filter((r) => Date.parse(r.startAt) >= now), ...list.filter((r) => Date.parse(r.startAt) < now).reverse()];
    $("#rides").innerHTML = ordered.map(rideCard).join("") ||
      (state.mode === "live" && state.rides.length ? `<p class="notice">${esc(t("noMatch"))}</p>` : "");
    fillFaces();
    renderBoard();
    focusTarget();
  }

  function renderBoard() {
    const totals = {};
    if (state.mode === "live") {
      const now = Date.now();
      for (const r of state.rides) {
        if (Date.parse(r.startAt) >= now) continue;
        if (state.sport !== "all" && sportOf(r) !== state.sport) continue;
        for (const id of riders(r.id)) {
          totals[id] ??= { km: 0, rides: 0 };
          totals[id].km += +r.distanceKm || 0; totals[id].rides += 1;
        }
      }
    }
    const rows = Object.entries(totals).sort((a, b) => b[1].km - a[1].km).slice(0, 10);
    $("#board").hidden = !rows.length;
    if (!rows.length) return;
    const list = $("#boardList");
    list.replaceChildren(...rows.map(([id, v], i) => {
      const li = document.createElement("li");
      li.dataset.uid = id;
      li.innerHTML = `<span class="rk">${i + 1}</span><img alt=""><span class="nm"></span><span class="km">${esc(t("boardRow", { km: Math.round(v.km), n: v.rides }))}</span>`;
      return li;
    }));
    if (user) user.profiles(rows.map((r) => r[0])).then((ps) => {
      for (const li of list.children) {
        const p = ps[li.dataset.uid];
        li.querySelector("img").src = p?.avatarUrl || "";
        li.querySelector(".nm").textContent = (p?.isMe ? t("you") : p?.name) || t("member");
      }
    });
  }

  // Opens the ride named in the link (#<ride id>) once the rides arrive.
  let targetDone = false;
  function focusTarget() {
    if (targetDone || state.mode !== "live") return;
    targetDone = true;
    const id = location.hash.slice(1);
    if (!id || id === "market") return;
    const el = document.querySelector(`.ride[data-id="${CSS.escape(id)}"]`);
    if (!el) return;
    el.classList.add("target");
    el.scrollIntoView({ block: "center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  }

  async function copyText(text, btn, done) {
    try { await navigator.clipboard.writeText(text); btn.textContent = done; }
    catch { btn.textContent = text; btn.style.userSelect = "all"; }
  }

  async function fillFaces() {
    if (!user) return;
    const boxes = [...document.querySelectorAll("[data-faces]")].filter((b) => b.dataset.faces);
    const ids = [...new Set(boxes.flatMap((b) => b.dataset.faces.split(",")))];
    if (!ids.length) return;
    const ps = await user.profiles(ids);
    for (const b of boxes) {
      b.replaceChildren(...b.dataset.faces.split(",").map((id) => {
        const img = document.createElement("img");
        img.src = ps[id]?.avatarUrl || ""; img.alt = ps[id]?.name || t("member"); img.title = ps[id]?.name || t("member");
        return img;
      }));
    }
  }

  function queueWrite(fn) { writeChain = writeChain.then(fn, fn); return writeChain; }

  async function toggleJoin(rideId) {
    if (!db || !state.me) return;
    const mine = state.joins.find((j) => j.id === state.me);
    const on = !(mine?.rides?.[rideId] === true);
    const ref = db.doc("joins/" + state.me);
    try {
      await queueWrite(() => mine ? ref.update({ rides: { [rideId]: on } }) : ref.set({ rides: { [rideId]: on } }));
    } catch (e) { flash(t(e.code === "invalid_argument" ? "errJoinPerm" : "errSave")); }
  }

  async function confirmThen(btn, fn) {
    if (btn.dataset.confirm !== "1") { btn.dataset.confirm = "1"; btn.textContent = t("confirmDel"); return; }
    try { await fn(); } catch { flash(t("errDel")); }
  }

  async function askAi(r, btn) {
    btn.disabled = true;
    state.ai[r.id] = t("thinking"); renderRides();
    const start = new Date(r.startAt);
    const run = sportOf(r) === "run";
    const prompt = `You help a UAE ${run ? "running" : "cycling"} group called Yalla Crew. Write 6 short bullet points to prepare for this ${run ? "run" : "ride"}: water and fuelling for UAE heat at this start time, gear, splitting into ${run ? "pace" : "speed"} groups, and road safety. Reply in ${t("aiLang")}. Plain text, no Markdown, each point on its own line starting with "•".

Sport: ${run ? "running" : "cycling"}
Title: ${txt(r, "title")}
Emirate: ${I18N.en["em_" + r.emirate]}
Meeting point: ${txt(r, "meet") ?? r.meetPoint}
When: ${start.toString()}
Distance: ${r.distanceKm} km; ${run ? `pace ${r.paceMinKm || "not set"} min/km` : `average speed ${r.paceKmh || "not set"} km/h`}; climb ${r.gainM || "unknown"} m
Level: ${I18N.en["lvl_" + r.level]}
Organiser notes: ${txt(r, "notes") || "none"}`;
    try {
      const { text } = await sample(prompt, { modelTier: "quick", onText: ({ text }) => {
        state.ai[r.id] = text;
        const box = document.querySelector(`.ride[data-id="${CSS.escape(r.id)}"] [data-ai]`);
        if (box) box.textContent = text;
      } });
      state.ai[r.id] = text;
    } catch (e) {
      if (["not_granted", "sampling_disabled", "capability_disabled", "not_declared"].includes(e.code)) { sample = null; delete state.ai[r.id]; }
      else state.ai[r.id] = e.text || t(e.code === "rate_limited" ? "rateLimit" : "aiFail");
    }
    renderRides();
  }

  // ---------- Market ----------
  function waDigits(phone) {
    let d = String(phone || "").replace(/\D/g, "");
    if (d.startsWith("00")) d = d.slice(2);
    if (d.length === 10 && d.startsWith("05")) d = "971" + d.slice(1);   // UAE mobile written locally
    return d;
  }
  function visibleListings() {
    let list = state.mode === "live" ? state.listings : EXAMPLE_ITEMS;
    const m = state.m;
    if (m.sport !== "all") list = list.filter((x) => x.sport === m.sport || x.sport === "both");
    if (m.cat !== "all") list = list.filter((x) => x.category === m.cat);
    if (m.q) { const q = m.q.toLowerCase(); list = list.filter((x) => (txt(x, "title") + " " + (txt(x, "desc") || "")).toLowerCase().includes(q)); }
    return list.slice().sort((a, b) => (a.sold ? 1 : 0) - (b.sold ? 1 : 0) || String(b.createdAt || "").localeCompare(String(a.createdAt || "")));
  }
  function itemCard(x) {
    const mine = state.mode === "live" && x.sellerId && x.sellerId === state.me;
    const photo = x.photo ? `<img src="/_blob/${esc(x.photo)}" alt="${esc(txt(x, "title"))}" loading="lazy" data-ph>` : esc(t("noPhoto"));
    const wa = waDigits(x.phone);
    const sportCls = x.sport === "both" ? "both" : x.sport === "run" ? "run" : "bike";
    const desc = txt(x, "desc");
    return `<article class="item${x.sold ? " sold" : ""}" data-id="${esc(x.id)}">
      <div class="ph">${photo}${x.sold ? `<span class="badge sold">${esc(t("sold"))}</span>` : x.example ? `<span class="badge example">${esc(t("example"))}</span>` : ""}</div>
      <div class="body">
        <div class="meta"><span class="pill ${sportCls}">${esc(t(sportCls))}</span><span class="pill">${esc(t("cat_" + x.category))}</span></div>
        <h3>${esc(txt(x, "title"))}</h3>
        <div class="price">${esc(Number(x.price).toLocaleString(I18N[lang].locale))} <small>${esc(t("aed"))}</small></div>
        <div class="meta"><span>${esc(t("cond_" + x.condition))}</span><span>${esc(t("em_" + x.emirate))}</span></div>
        ${desc ? `<p class="desc">${esc(desc)}</p>` : ""}
        ${x.sold ? "" : `<div class="contact"><span class="num">${esc(x.phone)}</span>
          <button type="button" data-act="copynum">${esc(t("copyNum"))}</button>
          ${wa.length >= 8 && !x.example ? `<a href="https://wa.me/${wa}" target="_blank" rel="noopener">${esc(t("whatsapp"))}</a>` : ""}</div>`}
        ${mine ? `<div class="actions">
          <button type="button" class="ghost" data-act="sold">${esc(t(x.sold ? "markAvail" : "markSold"))}</button>
          <button type="button" class="link" data-act="delItem">${esc(t("delAd"))}</button></div>` : ""}
      </div>
    </article>`;
  }
  function renderMarket() {
    $("#mFilters").innerHTML = chips(["all", "bike", "run"], state.m.sport, "data-f");
    const list = visibleListings();
    $("#market").innerHTML = list.map(itemCard).join("") ||
      (state.mode === "live" && state.listings.length ? `<p class="notice">${esc(t("noMatch"))}</p>` : "");
    for (const img of document.querySelectorAll("#market img[data-ph]")) img.addEventListener("error", () => { img.src = PH; }, { once: true });
  }

  function render() {
    renderStatus();
    $("#tab-rides").hidden = state.tab !== "rides";
    $("#tab-market").hidden = state.tab !== "market";
    for (const b of document.querySelectorAll("[data-tab]")) b.setAttribute("aria-selected", b.dataset.tab === state.tab);
    if (state.tab === "rides") renderRides(); else renderMarket();
  }

  function flash(msg) { const el = $("#status"); el.textContent = msg; el.hidden = false; }

  // ---------- Language ----------
  function options(sel, keys, prefix, keep) {
    const el = $(sel), cur = keep ? el.value : null;
    el.innerHTML = keys.map((k) => `<option value="${k}">${esc(t(prefix + k))}</option>`).join("");
    if (cur && keys.includes(cur)) el.value = cur;
  }
  function applyLang() {
    const app = $("#app"), L = I18N[lang];
    app.lang = lang; app.dir = L.dir;
    fmtDate = new Intl.DateTimeFormat(L.locale, { weekday: "long", day: "numeric", month: "long" });
    fmtTime = new Intl.DateTimeFormat(L.locale, { hour: "numeric", minute: "2-digit" });
    for (const el of document.querySelectorAll("[data-i18n]")) el.textContent = t(el.dataset.i18n);
    for (const el of document.querySelectorAll("[data-i18n-ph]")) el.placeholder = t(el.dataset.i18nPh);
    for (const el of document.querySelectorAll("[data-i18n-aria]")) el.setAttribute("aria-label", t(el.dataset.i18nAria));
    for (const b of document.querySelectorAll("[data-lang]")) b.setAttribute("aria-pressed", b.dataset.lang === lang);
    const efv = $("#emirateFilter").value || "all";
    $("#emirateFilter").innerHTML = `<option value="all">${esc(t("allEmirates"))}</option>` + EMIRATES.map((e) => `<option value="${e}">${esc(t("em_" + e))}</option>`).join("");
    $("#emirateFilter").value = efv;
    const mcv = $("#mCat").value || "all";
    $("#mCat").innerHTML = `<option value="all">${esc(t("allCats"))}</option>` + CATS.map((c) => `<option value="${c}">${esc(t("cat_" + c))}</option>`).join("");
    $("#mCat").value = mcv;
    options("#f-sport", ["bike", "run"], "", true);
    options("#s-sport", ["bike", "run", "both"], "", true);
    options("#f-emirate", EMIRATES, "em_", true);
    options("#s-emirate", EMIRATES, "em_", true);
    options("#f-level", LEVELS, "lvl_", true);
    options("#s-cat", CATS, "cat_", true);
    options("#s-cond", CONDS, "cond_", true);
    syncPace(false);
    render();
  }
  $("#langs").addEventListener("click", (e) => {
    const b = e.target.closest("[data-lang]"); if (!b) return;
    lang = b.dataset.lang;
    try { localStorage.setItem("yc-lang", lang); } catch {}
    applyLang();
  });

  // ---------- Events ----------
  for (const b of document.querySelectorAll("[data-tab]")) b.addEventListener("click", () => { state.tab = b.dataset.tab; render(); });

  $("#filters").addEventListener("click", (e) => {
    const b = e.target.closest("[data-f], [data-mine]"); if (!b) return;
    if (b.hasAttribute("data-mine")) state.mine = !state.mine; else state.sport = b.dataset.f;
    renderRides();
  });
  $("#emirateFilter").addEventListener("change", (e) => { state.emirate = e.target.value; renderRides(); });
  $("#rides").addEventListener("click", (e) => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    const id = b.closest(".ride").dataset.id;
    const r = (state.mode === "live" ? state.rides : EXAMPLES).find((x) => x.id === id);
    if (b.dataset.act === "join") toggleJoin(id);
    else if (b.dataset.act === "del") confirmThen(b, () => db.doc("rides/" + id).delete());
    else if (b.dataset.act === "link") copyText(ARTIFACT + "#" + id, b, t("copied"));
    else if (b.dataset.act === "ai" && r) askAi(r, b);
  });

  $("#mFilters").addEventListener("click", (e) => {
    const b = e.target.closest("[data-f]"); if (!b) return;
    state.m.sport = b.dataset.f; renderMarket();
  });
  $("#mCat").addEventListener("change", (e) => { state.m.cat = e.target.value; renderMarket(); });
  $("#mSearch").addEventListener("input", (e) => { state.m.q = e.target.value.trim(); renderMarket(); });
  $("#market").addEventListener("click", async (e) => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    const id = b.closest(".item").dataset.id;
    const x = (state.mode === "live" ? state.listings : EXAMPLE_ITEMS).find((i) => i.id === id);
    if (!x) return;
    if (b.dataset.act === "copynum") copyText(x.phone, b, t("copiedNum"));
    else if (b.dataset.act === "sold") {
      b.disabled = true;
      try { await db.doc("listings/" + id).update({ sold: !x.sold }); } catch { flash(t("errSave")); b.disabled = false; }
    } else if (b.dataset.act === "delItem") confirmThen(b, async () => {
      await db.doc("listings/" + id).delete();
      if (x.photo && assets) assets.delete(x.photo).catch(() => {});
    });
  });

  // Ride form
  const form = $("#addForm");
  function syncPace(reset = true) {
    const pace = $("#f-pace"), run = $("#f-sport").value === "run";
    $("#paceLbl").textContent = t(run ? "fPace" : "fSpeed");
    $("#f-meet").placeholder = t(run ? "fMeetPh_run" : "fMeetPh_bike");
    if (!reset) return;
    if (run) { pace.min = 3; pace.max = 12; pace.step = 0.25; pace.value = 6; }
    else { pace.min = 10; pace.max = 50; pace.step = 1; pace.value = 28; }
  }
  $("#f-sport").addEventListener("change", () => syncPace(true));
  $("#openForm").addEventListener("click", () => {
    form.hidden = false;
    if (!$("#f-date").value) $("#f-date").value = nextFriday().slice(0, 10);
    $("#f-title").focus();
  });
  $("#cancelForm").addEventListener("click", () => { form.hidden = true; $("#formErr").textContent = ""; });

  async function takeGpx(file) {
    const info = $("#gpxInfo");
    try {
      const g = parseGpx(await file.text());
      state.gpx = g;
      $("#f-km").value = g.km;
      if (!$("#f-title").value && g.name) $("#f-title").value = g.name.slice(0, 80);
      info.className = "ok";
      info.textContent = t("gpxOk", { km: g.km, gain: g.gain, n: g.route.length });
    } catch (err) {
      state.gpx = null; info.className = "err"; info.textContent = err.message || t("gpxBad");
    }
  }
  $("#f-gpx").addEventListener("change", (e) => { const f = e.target.files[0]; if (f) takeGpx(f); });
  const drop = $("#drop");
  drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("drag"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("drag"));
  drop.addEventListener("drop", (e) => { e.preventDefault(); drop.classList.remove("drag"); const f = e.dataTransfer.files[0]; if (f) takeGpx(f); });

  const writeErr = (ex) => t(ex.code === "invalid_argument" ? "errPerm" : ex.code === "quota_exceeded" ? "errQuota" : "errSave");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const err = $("#formErr");
    const title = $("#f-title").value.trim(), meet = $("#f-meet").value.trim();
    const km = parseFloat($("#f-km").value), pace = parseFloat($("#f-pace").value), max = parseInt($("#f-max").value, 10);
    const date = $("#f-date").value, time = $("#f-time").value;
    if (!title || !meet || !date || !time) { err.textContent = t("errRequired"); return; }
    if (!(km > 0)) { err.textContent = t("errKm"); return; }
    const startAt = new Date(`${date}T${time}`);
    if (isNaN(startAt)) { err.textContent = t("errDate"); return; }
    err.textContent = "";
    const btn = $("#saveBtn"); btn.disabled = true;
    try {
      const sport = $("#f-sport").value;
      await db.collection("rides").add({
        sport, title, meetPoint: meet, emirate: $("#f-emirate").value, level: $("#f-level").value,
        startAt: startAt.toISOString(), distanceKm: Math.round(km * 10) / 10,
        paceKmh: sport === "bike" && pace > 0 ? Math.round(pace) : null,
        paceMinKm: sport === "run" && pace > 0 ? Math.round(pace * 4) / 4 : null,
        gainM: state.gpx?.gain ?? null, maxRiders: max >= 2 ? max : null,
        notes: $("#f-notes").value.trim(), route: state.gpx?.route ?? [],
        createdBy: state.me, createdAt: new Date().toISOString()
      });
      form.reset(); syncPace(true); state.gpx = null; $("#gpxInfo").textContent = ""; form.hidden = true;
    } catch (ex) { err.textContent = writeErr(ex); }
    finally { btn.disabled = false; }
  });

  // Sell form
  const sellForm = $("#sellForm");
  $("#openSell").addEventListener("click", () => {
    sellForm.hidden = false;
    $("#s-photo-wrap").hidden = !assets; $("#s-photo-off").hidden = !!assets;
    $("#s-title").focus();
  });
  $("#cancelSell").addEventListener("click", () => { sellForm.hidden = true; $("#sellErr").textContent = ""; });
  sellForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const err = $("#sellErr");
    const title = $("#s-title").value.trim(), phone = $("#s-phone").value.trim(), price = parseFloat($("#s-price").value);
    if (!title || !phone || !(price >= 0)) { err.textContent = t("errSellReq"); return; }
    if (waDigits(phone).length < 8 || waDigits(phone).length > 15) { err.textContent = t("errPhone"); return; }
    err.textContent = "";
    const btn = $("#sellBtn"); btn.disabled = true;
    let photo = null;
    try {
      const file = $("#s-photo").files[0];
      if (file && assets) {
        err.textContent = t("uploading");
        try { photo = (await assets.upload(file)).id; err.textContent = ""; }
        catch { err.textContent = t("errPhoto"); btn.disabled = false; return; }
      }
      await db.collection("listings").add({
        title, sport: $("#s-sport").value, category: $("#s-cat").value, condition: $("#s-cond").value,
        price: Math.round(price), emirate: $("#s-emirate").value, phone,
        description: $("#s-desc").value.trim(), photo, sold: false,
        sellerId: state.me, createdAt: new Date().toISOString()
      });
      sellForm.reset(); sellForm.hidden = true;
    } catch (ex) { err.textContent = writeErr(ex); }
    finally { btn.disabled = false; }
  });

  // ---------- Boot ----------
  applyLang();
  (async () => {
    if (!window.claude?.use) { state.mode = "example"; render(); return; }
    [db, user, sample, assets] = await Promise.all(["db", "user", "sample", "assets"].map((n) => claude.use(n)));
    if (!db) { state.mode = "example"; render(); return; }
    state.me = user ? await user.id() : null;
    const cw = user ? await user.can("data.write") : null;
    state.canWrite = cw !== false && !!state.me;
    const fail = (e) => { if (e.code === "revoked") { db = null; state.mode = "example"; render(); } else flash(t("disconnected")); };
    db.collection("rides").orderBy("startAt").onSnapshot((s) => {
      state.rides = s.docs.map((d) => ({ id: d.id, ...d.data() }));
      state.mode = "live"; render();
    }, fail);
    db.collection("joins").onSnapshot((s) => {
      state.joins = s.docs.map((d) => ({ id: d.id, ...d.data() }));
      if (state.tab === "rides") renderRides();
    }, fail);
    db.collection("listings").onSnapshot((s) => {
      state.listings = s.docs.map((d) => ({ id: d.id, ...d.data(), desc: d.data().description }));
      if (state.mode === "live") render();
    }, fail);
  })();
})();
</script>
